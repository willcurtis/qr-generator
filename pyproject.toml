[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thetechshed-qr-generator"
version = "1.0.0"
description = "A Tech Shed themed CLI and desktop QR code generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Will Curtis" }]
dependencies = [
    "customtkinter>=5.2,<6",
    "qrcode[pil]>=7.4,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
qr-generator = "qr_generator.cli:main"
qr-generator-gui = "qr_generator.gui:run"

[tool.setuptools.packages.find]
include = ["qr_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
